name: Verify Windows package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - name: Runtime unit tests
        shell: powershell
        run: node --disable-warning=ExperimentalWarning --experimental-transform-types --test runtime/injection-session.test.ts runtime/repair-renderer.test.ts
      - name: Check publishable sources
        shell: powershell
        run: node --experimental-transform-types scripts/check-public-source.ts
      - name: Mixed-DPI window restore regression tests
        shell: powershell
        run: ./scripts/test-window-restore.ps1
      - name: Build offline packages
        shell: powershell
        run: ./scripts/build-release.ps1
      - name: Test install, upgrade, integrity and uninstall
        shell: powershell
        run: ./scripts/test-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: dist/v*/*
          retention-days: 7
